# Développement : docker compose -f compose.dev.yaml up --build
# La configuration vient du fichier .env (CSV_DIR, PORT, WATCH_POLLING)
services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      CSV_DIR: /csv
      PORT: "3000"
      WATCH_POLLING: "${WATCH_POLLING:-true}"
    volumes:
      - .:/app
      - /app/node_modules
      - ${CSV_DIR:?Renseigne CSV_DIR dans le fichier .env}:/csv:ro
